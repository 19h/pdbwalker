[package]
name = "pdbwalker"
version = "2.1.0"
edition = "2024"
rust-version = "1.100"
description = "Advanced PE binary scanner with PDB debug symbol detection and download capabilities"
repository = "https://github.com/19h/pdbwalker"
license = "MIT"
readme = "readme.md"

[dependencies]
anstream = "1.0"
anstyle = "1.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "default-tls", "http2", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
